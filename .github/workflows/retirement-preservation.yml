name: Archival preservation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preservation:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original source and archival policy
        run: python3 .github/scripts/validate-retirement.py
  notices:
    name: Pre-Commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate policy JSON and warning surfaces
        run: |
          python3 -m json.tool RETIRED.json > /dev/null
          python3 .github/scripts/validate-retirement.py
          git diff --check HEAD^ HEAD
